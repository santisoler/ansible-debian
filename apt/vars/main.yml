# ----------------------------------------------------------------
# Variables for configuring apt, upgrading and installing packages
# ----------------------------------------------------------------

upgrade: true

repositories:
  - url: http://deb.debian.org/debian
    distribution: trixie
    components:
      - main
      - contrib
      - non-free-firmware
  - url: http://deb.debian.org/debian
    distribution: trixie-updates
    components:
      - main
      - contrib
      - non-free-firmware
  - url: http://deb.debian.org/debian
    distribution: trixie-backports
    components:
      - main
      - contrib
      - non-free-firmware
  - url: http://security.debian.org/debian-security/
    distribution: trixie-security
    components:
      - main
      - contrib
      - non-free-firmware

backports:
  distribution: trixie-backports
  packages:
    - yt-dlp

packages:
  # Shell tools
  - git
  - tmux
  - zsh
  - htop
  - curl
  - wget
  - stow
  - vim
  - gnupg
  - tree
  - ripgrep
  - fzf
  - xclip
  - wipe
  - unzip
  - pdftk
  - pandoc
  - gh # github cli
  - git-delta
  - python3-pip
  - pipx
  - python-is-python3
  - black
  - ipython3
  - fd-find
  - bash-completion
  # Office
  - thunderbird
  - keepassxc
  - libreoffice
  - latexmk
  - texlive
  - texlive-bibtex-extra
  - texlive-latex-extra
  - tealdeer
  # Fonts
  - fonts-recommended
  - ttf-mscorefonts-installer
  # Internet
  - chromium
  # Utilities
  - ntpsec
  - grsync
  - gnome-software-plugin-flatpak
  - diodon # clipboard for gnome
  # Multimedia
  - mpv
  - gthumb
  - gimp
  - inkscape
  - darktable
